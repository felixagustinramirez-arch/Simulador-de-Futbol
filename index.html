<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrera Manager — Fase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --pitch: #0F3D2E;
    --pitch-deep: #0A2C21;
    --paper: #EDE8DD;
    --paper-dim: #E1DACB;
    --ink: #1B1B16;
    --ink-soft: #4B4A3F;
    --gold: #C9A227;
    --gold-soft: #E4C862;
    --line: #3E6B52;
    --danger: #A63D40;
    --danger-soft: #E8D3D2;
    --title-zone: #E4C862;
    --relegation-zone: #E8D3D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--pitch);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 80px);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #root{ max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 12px; margin-bottom: 24px;
  }
  .masthead h1{ color: var(--paper); font-size: 28px; margin:0; font-weight:700; }
  .masthead .eyebrow{ color: var(--gold-soft); font-size: 11px; letter-spacing:0.18em; margin-bottom:4px; }
  .masthead .season-tag{ color: var(--paper-dim); font-size:13px; }

  .panel{
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    padding: 22px 24px;
  }

  /* ---- Setup screen ---- */
  .setup-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 800px){ .setup-grid{ grid-template-columns: 1fr; } }
  label{ display:block; font-size: 12px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-soft); margin: 16px 0 6px; font-weight:600;}
  label:first-child{ margin-top:0; }
  input[type=text]{
    width:100%; padding:10px 12px; border:1px solid #C9C2AE; border-radius:2px;
    background:#fff; font-family:'Inter'; font-size:15px; color:var(--ink);
  }
  input[type=text]:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .color-row{ display:flex; gap:14px; }
  .color-field{ flex:1; }
  input[type=color]{ width:100%; height:38px; border:1px solid #C9C2AE; border-radius:2px; padding:2px; background:#fff; cursor:pointer; }

  .pattern-options, .tier-options{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .tier-options{ grid-template-columns: 1fr; }
  .chip{
    border:1.5px solid #C9C2AE; border-radius:2px; padding:8px 10px; text-align:center;
    cursor:pointer; font-size:13px; background:#fff; color:var(--ink-soft); transition: all .12s;
  }
  .chip.selected{ border-color: var(--pitch); background: var(--pitch); color: var(--paper); font-weight:600; }
  .tier-chip{ text-align:left; display:flex; justify-content:space-between; align-items:center; padding:12px; }
  .tier-chip .tier-name{ font-weight:600; font-size:14px; }
  .tier-chip .tier-detail{ font-size:12px; color: var(--ink-soft); font-family:'IBM Plex Mono'; }
  .tier-chip.selected .tier-detail{ color: var(--paper-dim); }

  .crest-card{
    background: var(--pitch-deep); border-radius:3px; padding:24px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    border: 1px solid var(--line);
  }
  .crest-card .id-label{ color: var(--gold-soft); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; }
  .crest-card .club-name{ color: var(--paper); font-size: 20px; font-weight:600; min-height:26px; }
  .crest-card .club-meta{ color: var(--paper-dim); font-size:12px; font-family:'IBM Plex Mono'; }

  button{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.05em;
    border:none; border-radius:2px; padding:12px 20px; font-size:14px; font-weight:600;
    cursor:pointer; transition: transform .08s;
  }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); color: var(--ink); }
  .btn-primary:hover:not(:disabled){ background: var(--gold-soft); }
  .btn-secondary{ background: var(--pitch); color: var(--paper); }
  .btn-secondary:hover:not(:disabled){ background: var(--pitch-deep); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1.5px solid #C9C2AE; }
  .btn-ghost:hover:not(:disabled){ border-color: var(--ink-soft); }
  .btn-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }

  /* ---- Dashboard ---- */
  .club-bar{
    display:flex; align-items:center; gap:16px; background: var(--pitch-deep);
    border-radius:3px; padding:14px 20px; margin-bottom:18px; border:1px solid var(--line);
  }
  .club-bar .info{ flex:1; }
  .club-bar .name{ color: var(--paper); font-size:19px; font-weight:600; margin:0; }
  .club-bar .sub{ color: var(--gold-soft); font-size:12px; font-family:'IBM Plex Mono'; margin-top:2px; }
  .club-bar .budget{ text-align:right; }
  .club-bar .budget .amount{ color: var(--gold-soft); font-size:18px; font-family:'IBM Plex Mono'; font-weight:600; }
  .club-bar .budget .label{ color: var(--paper-dim); font-size:10px; text-transform:uppercase; letter-spacing:0.12em; }

  .tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .tab-btn{
    background: transparent; color: var(--paper-dim); border:1.5px solid var(--line);
    padding:8px 16px; font-size:12px;
  }
  .tab-btn.active{ background: var(--paper); color: var(--pitch); border-color: var(--paper); }

  table{ width:100%; border-collapse: collapse; font-size:13px; }
  th{
    text-align:left; font-family:'IBM Plex Mono'; font-size:10px; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--ink-soft); padding:8px 6px; border-bottom:2px solid var(--pitch);
  }
  td{ padding:8px 6px; border-bottom:1px solid #DAD3C0; font-family:'IBM Plex Mono'; }
  td.team-name{ font-family:'Inter'; font-weight:500; }
  tr.you td{ background: rgba(201,162,39,0.18); font-weight:600; }
  tr.zone-title td.pos-cell{ box-shadow: inset 3px 0 0 var(--title-zone); }
  tr.zone-releg td.pos-cell{ box-shadow: inset 3px 0 0 var(--danger); }
  .legend{ display:flex; gap:18px; margin-top:10px; font-size:11px; color: var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:1px; display:inline-block; }

  .matchday-title{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .fixture-list{ display:flex; flex-direction:column; gap:6px; }
  .fixture{
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px;
    padding:9px 12px; background:#fff; border:1px solid #DAD3C0; border-radius:2px; font-size:13px;
  }
  .fixture.you{ border-color: var(--gold); border-width:1.5px; }
  .fixture .home{ text-align:right; }
  .fixture .away{ text-align:left; }
  .fixture .score{
    font-family:'IBM Plex Mono'; font-weight:600; background: var(--paper-dim);
    padding:3px 10px; border-radius:2px; min-width:52px; text-align:center;
  }
  .fixture .score.pending{ color: var(--ink-soft); font-weight:400; }

  .banner{
    background: var(--gold); color: var(--ink); padding:16px 20px; border-radius:3px;
    margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .banner h3{ margin:0; font-size:16px; }
  .banner p{ margin:2px 0 0; font-size:12px; font-family:'IBM Plex Mono'; }

  .history-item{
    display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid #DAD3C0; font-size:13px;
  }
  .history-item .season-num{ font-family:'IBM Plex Mono'; color: var(--ink-soft); }

  .io-row{ display:flex; gap:8px; margin-top:16px; padding-top:16px; border-top:1px dashed #C9C2AE; }
  .footnote{ color: var(--paper-dim); font-size:11px; margin-top:18px; text-align:center; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useRef, useMemo} = React;

/* ---------- Data helpers ---------- */

const PREFIXES = ["Real","Atlético","Deportivo","Unión","Sporting","Racing","Club","Cultural","Gimnástico","Juventud","Nacional","Provincial","Estrella","Alianza"];
const PLACES = ["Río Claro","Puerto Alto","Villa Nueva","San Marín","Costa Verde","Monte Bello","Los Álamos","Bahía Sur","Cerro Alto","Valle Hondo","Playa Dorada","Sierra Norte","Campo Grande","El Progreso","Nueva Esperanza","Punta Fría","Loma Larga","Río Seco"];

function generateClubNames(count, excludeName){
  const used = new Set([excludeName]);
  const names = [];
  while(names.length < count){
    const p = PREFIXES[Math.floor(Math.random()*PREFIXES.length)];
    const place = PLACES[Math.floor(Math.random()*PLACES.length)];
    const style = Math.random();
    let name = style < 0.6 ? `${p} ${place}` : `${place} FC`;
    if(!used.has(name)){ used.add(name); names.push(name); }
  }
  return names;
}

const TIERS = {
  amateur:   { label: "Amateur",     range: [35,50], budget: 500000,    spread: 18 },
  regional:  { label: "Regional",    range: [50,65], budget: 2000000,   spread: 20 },
  profesional: { label: "Profesional", range: [60,75], budget: 8000000, spread: 20 },
  elite:     { label: "Élite",       range: [75,90], budget: 25000000,  spread: 18 },
};

const PATTERNS = ["franjas","cuartos","diagonal","liso"];

function fmtMoney(n){
  return "$" + Math.round(n).toLocaleString("es-AR");
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function poissonRandom(lambda){
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do{ k++; p *= Math.random(); } while(p > L);
  return k - 1;
}

function simulateScore(strengthA, strengthB, isHomeA){
  const base = 1.3;
  const homeBonus = isHomeA ? 0.22 : -0.1;
  const diffA = (strengthA - strengthB) / 26;
  const diffB = (strengthB - strengthA) / 26;
  const lambdaA = Math.min(4, Math.max(0.15, base + diffA + homeBonus));
  const lambdaB = Math.min(4, Math.max(0.15, base + diffB - homeBonus*0.4));
  return [poissonRandom(lambdaA), poissonRandom(lambdaB)];
}

function generateRoundRobin(teamIds){
  let arr = teamIds.slice();
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const half = n/2;
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const roundFixtures = [];
    for(let i=0;i<half;i++){
      const home = arr[i], away = arr[n-1-i];
      if(home!==null && away!==null){
        roundFixtures.push(r%2===0 ? [home,away] : [away,home]);
      }
    }
    rounds.push(roundFixtures);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  const secondLeg = rounds.map(round => round.map(([h,a]) => [a,h]));
  return [...rounds, ...secondLeg];
}

function freshStandingsRow(team){
  return { id: team.id, name: team.name, isYou: !!team.isYou,
    pj:0, g:0, e:0, p:0, gf:0, gc:0, pts:0 };
}

function computeStandings(teams, fixtures, resultsByRound, uptoRound){
  const table = {};
  teams.forEach(t => table[t.id] = freshStandingsRow(t));
  for(let r=0; r<uptoRound; r++){
    const round = fixtures[r]; const results = resultsByRound[r];
    if(!round || !results) continue;
    round.forEach(([homeId,awayId], idx) => {
      const [gh, ga] = results[idx];
      const home = table[homeId], away = table[awayId];
      home.pj++; away.pj++;
      home.gf += gh; home.gc += ga;
      away.gf += ga; away.gc += gh;
      if(gh > ga){ home.g++; home.pts+=3; away.p++; }
      else if(gh < ga){ away.g++; away.pts+=3; home.p++; }
      else { home.e++; away.e++; home.pts++; away.pts++; }
    });
  }
  return Object.values(table).sort((a,b) =>
    b.pts - a.pts || (b.gf-b.gc) - (a.gf-a.gc) || b.gf - a.gf || a.name.localeCompare(b.name)
  );
}

/* ---------- Crest ---------- */

function Crest({name, primary, secondary, pattern, size=96}){
  const initials = (name||"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "CM";
  const clipId = "shield-" + primary.slice(1) + secondary.slice(1) + pattern;
  return (
    <svg width={size} height={size*1.12} viewBox="0 0 100 112">
      <defs>
        <clipPath id={clipId}>
          <path d="M50 2 L95 14 V55 C95 85 75 102 50 110 C25 102 5 85 5 55 V14 Z" />
        </clipPath>
      </defs>
      <g clipPath={`url(#${clipId})`}>
        <rect x="0" y="0" width="100" height="112" fill={secondary} />
        {pattern === "franjas" && [0,1,2,3,4].map(i => (
          <rect key={i} x={i*22-6} y="0" width="11" height="112" fill={primary} />
        ))}
        {pattern === "cuartos" && (
          <>
            <rect x="0" y="0" width="50" height="56" fill={primary} />
            <rect x="50" y="56" width="50" height="56" fill={primary} />
          </>
        )}
        {pattern === "diagonal" && (
          <polygon points="0,0 100,0 0,112" fill={primary} />
        )}
        {pattern === "liso" && (
          <rect x="8" y="8" width="84" height="96" fill="none" stroke={primary} strokeWidth="6" />
        )}
      </g>
      <path d="M50 2 L95 14 V55 C95 85 75 102 50 110 C25 102 5 85 5 55 V14 Z"
            fill="none" stroke="#1B1B16" strokeOpacity="0.35" strokeWidth="2" />
      <text x="50" y="63" textAnchor="middle" fontFamily="Oswald, sans-serif" fontWeight="700"
            fontSize="30" fill={pattern==="liso" ? primary : "#fff"}
            style={{paintOrder:"stroke", stroke:"rgba(0,0,0,0.35)", strokeWidth:1}}>
        {initials}
      </text>
    </svg>
  );
}

/* ---------- Setup Screen ---------- */

function SetupScreen({onCreate}){
  const [name, setName] = useState("");
  const [city, setCity] = useState("");
  const [primary, setPrimary] = useState("#0F3D2E");
  const [secondary, setSecondary] = useState("#EDE8DD");
  const [pattern, setPattern] = useState("franjas");
  const [tier, setTier] = useState("regional");

  const canCreate = name.trim().length > 1;

  return (
    <div className="panel">
      <h2 style={{marginTop:0, color:'var(--pitch)'}}>Fundación del club</h2>
      <p style={{color:'var(--ink-soft)', fontSize:14, marginTop:-8}}>
        Elegí el nombre, los colores y el nivel de tu club para arrancar la carrera.
      </p>
      <div className="setup-grid">
        <div>
          <label>Nombre del club</label>
          <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Ej: Unión Río Claro" maxLength={30}/>

          <label>Ciudad</label>
          <input type="text" value={city} onChange={e=>setCity(e.target.value)} placeholder="Ej: Río Claro" maxLength={24}/>

          <label>Colores</label>
          <div className="color-row">
            <div className="color-field">
              <input type="color" value={primary} onChange={e=>setPrimary(e.target.value)} />
            </div>
            <div className="color-field">
              <input type="color" value={secondary} onChange={e=>setSecondary(e.target.value)} />
            </div>
          </div>

          <label>Diseño del escudo</label>
          <div className="pattern-options">
            {PATTERNS.map(p => (
              <div key={p} className={"chip" + (pattern===p ? " selected" : "")} onClick={()=>setPattern(p)}>
                {p}
              </div>
            ))}
          </div>

          <label>Nivel de club</label>
          <div className="tier-options">
            {Object.entries(TIERS).map(([key,t]) => (
              <div key={key} className={"chip tier-chip" + (tier===key ? " selected" : "")} onClick={()=>setTier(key)}>
                <span className="tier-name">{t.label}</span>
                <span className="tier-detail">fuerza {t.range[0]}–{t.range[1]} · {fmtMoney(t.budget)}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="crest-card">
          <div className="id-label">Vista previa</div>
          <Crest name={name} primary={primary} secondary={secondary} pattern={pattern} size={120}/>
          <div className="club-name">{name || "Tu club"}</div>
          <div className="club-meta">{city || "Ciudad"} · {TIERS[tier].label}</div>
          <div className="club-meta">Presupuesto inicial: {fmtMoney(TIERS[tier].budget)}</div>
        </div>
      </div>

      <div className="btn-row">
        <button className="btn-primary" disabled={!canCreate}
          onClick={()=>onCreate({name:name.trim(), city:city.trim()||"—", primary, secondary, pattern, tier})}>
          Fundar club y armar liga
        </button>
      </div>
    </div>
  );
}

/* ---------- Dashboard ---------- */

function Dashboard({state, setState}){
  const {club, teams, fixtures, resultsByRound, currentRound, history, season} = state;
  const [tab, setTab] = useState("jornada");
  const fileInputRef = useRef(null);

  const totalRounds = fixtures.length;
  const seasonOver = currentRound >= totalRounds;
  const standings = useMemo(() => computeStandings(teams, fixtures, resultsByRound, currentRound),
    [teams, fixtures, resultsByRound, currentRound]);

  function simulateRound(uptoRound){
    setState(prev => {
      const newResults = prev.resultsByRound.slice();
      let r = prev.currentRound;
      while(r < uptoRound && r < prev.fixtures.length){
        const teamsById = {}; prev.teams.forEach(t=>teamsById[t.id]=t);
        const roundResults = prev.fixtures[r].map(([homeId,awayId]) => {
          const home = teamsById[homeId], away = teamsById[awayId];
          return simulateScore(home.strength, away.strength, true);
        });
        newResults[r] = roundResults;
        r++;
      }
      return {...prev, resultsByRound: newResults, currentRound: r};
    });
  }

  function startNewSeason(){
    setState(prev => {
      const finalStandings = computeStandings(prev.teams, prev.fixtures, prev.resultsByRound, prev.currentRound);
      const yourPos = finalStandings.findIndex(r => r.isYou) + 1;
      const champion = finalStandings[0];
      const newHistory = [...prev.history, {
        season: prev.season, yourPosition: yourPos, totalTeams: finalStandings.length,
        championName: champion.name, championIsYou: champion.isYou
      }];
      const teamIds = prev.teams.map(t=>t.id);
      const newFixtures = generateRoundRobin(teamIds);
      return {...prev, fixtures: newFixtures, resultsByRound: [], currentRound: 0,
        season: prev.season + 1, history: newHistory};
    });
  }

  function exportSave(){
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `carrera-manager-${club.name.replace(/\s+/g,'_')}.json`;
    a.click(); URL.revokeObjectURL(url);
  }

  function importSave(e){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try{
        const parsed = JSON.parse(evt.target.result);
        if(parsed && parsed.club && parsed.teams && parsed.fixtures){ setState(parsed); }
        else alert("El archivo no tiene el formato esperado.");
      }catch(err){ alert("No se pudo leer el archivo de guardado."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const currentFixtures = !seasonOver ? fixtures[currentRound] : null;
  const teamsById = {}; teams.forEach(t=>teamsById[t.id]=t);

  return (
    <div>
      <div className="club-bar">
        <Crest name={club.name} primary={club.primary} secondary={club.secondary} pattern={club.pattern} size={56}/>
        <div className="info">
          <p className="name">{club.name}</p>
          <p className="sub">{club.city} · {TIERS[club.tier].label} · Temporada {season}</p>
        </div>
        <div className="budget">
          <div className="amount">{fmtMoney(club.budget)}</div>
          <div className="label">Presupuesto</div>
        </div>
      </div>

      {seasonOver && (
        <div className="banner">
          <div>
            <h3>Temporada {season} finalizada</h3>
            <p>Campeón: {standings[0].name}{standings[0].isYou ? " (¡tu club!)" : ""} · Terminaste {standings.findIndex(r=>r.isYou)+1}° de {standings.length}</p>
          </div>
          <button className="btn-primary" onClick={startNewSeason}>Iniciar temporada {season+1}</button>
        </div>
      )}

      <div className="tabs">
        <button className={"tab-btn" + (tab==="jornada"?" active":"")} onClick={()=>setTab("jornada")}>Jornada</button>
        <button className={"tab-btn" + (tab==="tabla"?" active":"")} onClick={()=>setTab("tabla")}>Tabla</button>
        <button className={"tab-btn" + (tab==="historial"?" active":"")} onClick={()=>setTab("historial")}>Historial</button>
      </div>

      {tab === "jornada" && (
        <div className="panel">
          {!seasonOver ? (
            <>
              <div className="matchday-title">
                <h3 style={{margin:0, color:'var(--pitch)'}}>Jornada {currentRound+1} de {totalRounds}</h3>
              </div>
              <div className="fixture-list">
                {currentFixtures.map(([homeId,awayId], idx) => {
                  const home = teamsById[homeId], away = teamsById[awayId];
                  const isYou = home.isYou || away.isYou;
                  return (
                    <div key={idx} className={"fixture" + (isYou ? " you" : "")}>
                      <div className="home">{home.name}</div>
                      <div className="score pending">vs</div>
                      <div className="away">{away.name}</div>
                    </div>
                  );
                })}
              </div>
              <div className="btn-row">
                <button className="btn-primary" onClick={()=>simulateRound(currentRound+1)}>Simular jornada</button>
                <button className="btn-secondary" onClick={()=>simulateRound(totalRounds)}>Simular temporada completa</button>
              </div>
            </>
          ) : (
            <>
              <h3 style={{marginTop:0, color:'var(--pitch)'}}>Última jornada jugada ({totalRounds})</h3>
              <div className="fixture-list">
                {fixtures[totalRounds-1].map(([homeId,awayId], idx) => {
                  const home = teamsById[homeId], away = teamsById[awayId];
                  const [gh,ga] = resultsByRound[totalRounds-1][idx];
                  const isYou = home.isYou || away.isYou;
                  return (
                    <div key={idx} className={"fixture" + (isYou ? " you" : "")}>
                      <div className="home">{home.name}</div>
                      <div className="score">{gh} - {ga}</div>
                      <div className="away">{away.name}</div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}

      {tab === "tabla" && (
        <div className="panel">
          <h3 style={{marginTop:0, color:'var(--pitch)'}}>Tabla de posiciones</h3>
          <table>
            <thead>
              <tr>
                <th>#</th><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
                <th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
              </tr>
            </thead>
            <tbody>
              {standings.map((row, i) => {
                const zone = i < 3 ? "zone-title" : (i >= standings.length-3 ? "zone-releg" : "");
                return (
                  <tr key={row.id} className={[row.isYou ? "you" : "", zone].filter(Boolean).join(" ")}>
                    <td className="pos-cell">{i+1}</td>
                    <td className="team-name">{row.name}</td>
                    <td>{row.pj}</td><td>{row.g}</td><td>{row.e}</td><td>{row.p}</td>
                    <td>{row.gf}</td><td>{row.gc}</td><td>{row.gf-row.gc}</td>
                    <td>{row.pts}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="legend">
            <span><span className="dot" style={{background:'var(--title-zone)'}}></span>Zona de título</span>
            <span><span className="dot" style={{background:'var(--danger)'}}></span>Zona de descenso (referencial — activo desde Fase 4)</span>
          </div>
        </div>
      )}

      {tab === "historial" && (
        <div className="panel">
          <h3 style={{marginTop:0, color:'var(--pitch)'}}>Historial de temporadas</h3>
          {history.length === 0 ? (
            <p style={{color:'var(--ink-soft)', fontSize:14}}>Todavía no completaste ninguna temporada.</p>
          ) : (
            history.slice().reverse().map(h => (
              <div key={h.season} className="history-item">
                <span className="season-num">Temporada {h.season}</span>
                <span>Campeón: {h.championName}{h.championIsYou ? " (vos)" : ""}</span>
                <span>Tu puesto: {h.yourPosition}° / {h.totalTeams}</span>
              </div>
            ))
          )}
        </div>
      )}

      <div className="io-row">
        <button className="btn-ghost" onClick={exportSave}>Descargar progreso (.json)</button>
        <button className="btn-ghost" onClick={()=>fileInputRef.current.click()}>Cargar progreso</button>
        <input ref={fileInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={importSave}/>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App(){
  const [state, setState] = useState(null);

  function handleCreate({name, city, primary, secondary, pattern, tier}){
    const tierInfo = TIERS[tier];
    const yourStrength = randInt(tierInfo.range[0], tierInfo.range[1]);
    const you = { id: "you", name, city, primary, secondary, pattern, isYou:true, strength: yourStrength };

    const cpuNames = generateClubNames(15, name);
    const cpuTeams = cpuNames.map((n, i) => {
      const spread = tierInfo.spread;
      const s = Math.min(96, Math.max(22, yourStrength + randInt(-spread, spread)));
      return { id: "cpu"+i, name: n, isYou:false, strength: s };
    });

    const teams = [you, ...cpuTeams];
    const fixtures = generateRoundRobin(teams.map(t=>t.id));

    setState({
      club: { name, city, primary, secondary, pattern, tier, budget: tierInfo.budget },
      teams, fixtures, resultsByRound: [], currentRound: 0, season: 1, history: []
    });
  }

  return (
    <div>
      <div className="masthead">
        <div>
          <div className="eyebrow">Carrera Manager · Fase 1</div>
          <h1>{state ? state.club.name : "Fundá tu club"}</h1>
        </div>
        {state && <div className="season-tag">Temporada {state.season}</div>}
      </div>
      {!state ? <SetupScreen onCreate={handleCreate}/> : <Dashboard state={state} setState={setState}/>}
      <div className="footnote">Fase 1 — creación de club y simulación de liga. Sin plantilla ni mercado todavía.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
